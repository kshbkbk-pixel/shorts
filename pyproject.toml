[project]
name = "shorts"
version = "0.1.0"
description = "주제 한 줄로 60초 한국어 쇼츠를 만드는 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "httpx>=0.27",
    "pillow>=10",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shorts = "shorts.cli:main"

[tool.setuptools]
packages = ["shorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
